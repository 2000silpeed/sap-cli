[project]
name = "sap-cli"
version = "0.1.0"
description = "SAP GUI Scripting CLI for AI Agents - Ontology-driven SAP automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
sap = "sap_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
